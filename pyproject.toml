[build-system]
requires = [ "poetry-core>=1.0.4",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "doraemon"
version = "0.2.0"
description = "Python doraemon dev tool box"
authors = [ "Vincent Duan <vincent.duan95@outlook.com>",]
maintainers = [ "Vincent Duan <vincent.duan95@outlook.com>",]
repository = "https://github.com/Duan-JM/doraemon"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Topic :: Software Development :: Libraries",]
keywords = [ "tools"]
include = [ "LICENSE", "README.md", { path = "src/doraemon/py.typed", format = ["sdist", "wheel"] }]
readme = "README.md"
license = "Apache-2.0"

[[tool.poetry.source]]
name = "aliyun for china users"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"

[tool.poetry.dependencies]
python = ">3.9,<3.11"
structlog = "^24.1"
structlog_sentry = ">=2.0.3,<3"
openai = "^1.37"
numbers_parser = ">=4.13.2"
pandas = "^2.2"
dacite = "^1.8.1"
aiohttp = "^3.10.10"
requests = "^2.32.3"
psycopg2-binary = "^2.9.9"
opentelemetry-api = ">=1.33.1,<2"
opentelemetry-sdk = ">=1.33.1,<2"
opentelemetry-exporter-otlp = ">=1.24,<2"
opentelemetry-exporter-otlp-proto-http = ">=1.24,<2"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest-cov = "^4.0.0"
pytest-asyncio = "^0.23.5"
pytest-xdist = "^3.2.1"
pytest-mock = ">0"
pytest = "^7.1.3"
black = "^22.10.0"
tqdm = "^4.66.4"
ipdb = "^0.13.13"
ruff = ">=0.5,<1.0"
mypy = ">=1.0,<3.0"
responses = "^0.26.0"
aioresponses = "^0.7.8"
pre-commit = "^3.7"

[tool.pytest.ini_options]
pythonpath = "src"
log_cli = true
log_cli_level = "DEBUG"
asyncio_mode = "auto"
markers = [
    "need_middlewares: marks tests as need external middlewares such as kafka",
]

[tool.coverage.run]
source = ["src"]
omit = []

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (formatter handles within reason)
]

[tool.ruff.lint.per-file-ignores]
"src/doraemon/__init__.py" = ["F401", "F403"]
"src/doraemon/services/__init__.py" = ["F401"]
"tests/**" = ["B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "numbers_parser.*",
    "dacite.*",
    "structlog_sentry.*",
    "psycopg2.*",
    "aiohttp.*",
    "opentelemetry.*",
    "requests.*",
    "pandas.*",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
