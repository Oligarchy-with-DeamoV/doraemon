repos:
  # Hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  # Lint + format (must match CI)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^(src|tests)/
      - id: ruff-format
        files: ^(src|tests)/

  # Type check (must match CI)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        files: ^src/
        # Pull in the same runtime deps mypy needs to resolve our imports.
        # Keep this list in sync with [tool.poetry.dependencies] in pyproject.toml.
        additional_dependencies:
          - structlog>=24.1
          - openai>=1.37
          - dacite>=1.8
          - requests>=2.32
          - aiohttp>=3.10
          - types-PyYAML
          - types-requests

  # Security scan (must match CI)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-r", "-q"]
        files: ^src/

  # Tests on push only — too slow for every commit.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: poetry run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
